<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="barTop" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f6e6c0"/>
      <stop offset="30%" stop-color="#dcb87e"/>
      <stop offset="60%" stop-color="#c9a56e"/>
      <stop offset="100%" stop-color="#8a6a3b"/>
    </linearGradient>
    <linearGradient id="barFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b28d55"/>
      <stop offset="55%" stop-color="#8a6a3b"/>
      <stop offset="100%" stop-color="#5f4726"/>
    </linearGradient>
    <linearGradient id="barSide" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#6d5230"/>
      <stop offset="100%" stop-color="#9a7743"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#c9a56e" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#c9a56e" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9a56e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgDepth" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#15243a"/>
      <stop offset="100%" stop-color="#081019"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="800" height="560" fill="url(#bgDepth)"/>
  <rect width="800" height="560" fill="url(#halo)"/>

  <!-- backdrop light -->
  <ellipse cx="420" cy="140" rx="300" ry="90" fill="#263c58" opacity="0.35" filter="url(#soft)" transform="rotate(-14 420 140)"/>

  <!-- contact shadow -->
  <ellipse cx="400" cy="516" rx="345" ry="36" fill="#020609" opacity="0.75" filter="url(#soft)"/>

  <!-- bar geometry helper: top face, front face, side faces -->
  <!-- bottom row: 3 bars -->
  <g>
    <g transform="translate(88,404)">
      <polygon points="22,0 222,0 244,88 0,88" fill="url(#barFront)"/>
      <polygon points="22,0 222,0 228,20 16,20" fill="url(#barTop)"/>
      <polygon points="222,0 244,88 228,70 214,14" fill="#7c5f36"/>
      <polygon points="0,88 244,88 238,80 6,80" fill="#3f2f18" opacity="0.6"/>
    </g>
    <g transform="translate(312,404)">
      <polygon points="22,0 222,0 244,88 0,88" fill="url(#barFront)"/>
      <polygon points="22,0 222,0 228,20 16,20" fill="url(#barTop)"/>
      <polygon points="222,0 244,88 228,70 214,14" fill="#7c5f36"/>
      <polygon points="0,88 244,88 238,80 6,80" fill="#3f2f18" opacity="0.6"/>
    </g>
    <g transform="translate(536,404)">
      <polygon points="22,0 222,0 244,88 0,88" fill="url(#barFront)"/>
      <polygon points="22,0 222,0 228,20 16,20" fill="url(#barTop)"/>
      <polygon points="222,0 244,88 228,70 214,14" fill="#7c5f36"/>
      <polygon points="0,88 244,88 238,80 6,80" fill="#3f2f18" opacity="0.6"/>
    </g>
    <!-- middle row: 2 bars -->
    <g transform="translate(200,312)">
      <polygon points="22,0 222,0 244,88 0,88" fill="url(#barFront)"/>
      <polygon points="22,0 222,0 228,20 16,20" fill="url(#barTop)"/>
      <polygon points="222,0 244,88 228,70 214,14" fill="#7c5f36"/>
      <polygon points="0,88 244,88 238,80 6,80" fill="#3f2f18" opacity="0.6"/>
    </g>
    <g transform="translate(424,312)">
      <polygon points="22,0 222,0 244,88 0,88" fill="url(#barFront)"/>
      <polygon points="22,0 222,0 228,20 16,20" fill="url(#barTop)"/>
      <polygon points="222,0 244,88 228,70 214,14" fill="#7c5f36"/>
      <polygon points="0,88 244,88 238,80 6,80" fill="#3f2f18" opacity="0.6"/>
    </g>
    <!-- top bar -->
    <g transform="translate(312,220)">
      <polygon points="22,0 222,0 244,88 0,88" fill="url(#barFront)"/>
      <polygon points="22,0 222,0 228,20 16,20" fill="url(#barTop)"/>
      <polygon points="222,0 244,88 228,70 214,14" fill="#7c5f36"/>
    </g>
  </g>

  <!-- stamp on top bar, engraved style -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="424" y="266" font-size="24" letter-spacing="4" fill="#4f3b1e">999.9</text>
    <text x="424" y="288" font-size="13" letter-spacing="3" fill="#4f3b1e" opacity="0.9">FINE GOLD</text>
    <text x="423" y="265" font-size="24" letter-spacing="4" fill="#e8cf9d" opacity="0.4">999.9</text>
  </g>

  <!-- edge highlights -->
  <polygon points="334,220 534,220 530,214 338,214" fill="#f8ecd0" opacity="0.35"/>
  <ellipse cx="360" cy="238" rx="90" ry="18" fill="#fff" opacity="0.12" transform="rotate(-12 360 238)"/>

  <!-- bounce light -->
  <ellipse cx="620" cy="470" rx="130" ry="40" fill="#c9a56e" opacity="0.1" filter="url(#soft)"/>
</svg>
